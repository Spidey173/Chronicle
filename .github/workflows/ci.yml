name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting & Code Quality
  # ----------------------------------------------------------------------------
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff Linter
        run: |
          ruff check app tests

      - name: Run Flake8 Syntax Check
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

  # ----------------------------------------------------------------------------
  # Job 2: Automated Testing with Coverage
  # ----------------------------------------------------------------------------
  test:
    name: Pytest & Coverage
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_analytics_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Sample Data
        run: |
          python sample_data/generator.py

      - name: Execute Pytest with Coverage
        env:
          DATABASE_URL: sqlite:///:memory:
          ENVIRONMENT: test
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Verify CLI End-to-End Pipeline
        env:
          DATABASE_URL: sqlite:///./data/test_pipeline.db
        run: |
          python -m app.cli init
          python -m app.cli run-all-samples
          python -m app.cli show-analytics

  # ----------------------------------------------------------------------------
  # Job 3: Docker Container Build
  # ----------------------------------------------------------------------------
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: chronicle-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
