services:
  # Web API & Interactive Dashboard
  - type: web
    name: chronicle-platform
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head && python -m app.cli init"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_NAME
        value: Chronicle
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: chronicle-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  # Free PostgreSQL Database
  - name: chronicle-db
    databaseName: analytics_db
    user: chronicle_admin
    plan: free
